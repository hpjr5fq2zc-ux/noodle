<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Noodle</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Noodle">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#1556C2}a:hover{color:#0E3F92}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes slideFromRight{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes rise{from{transform:translateY(100%)}to{transform:none}}
@keyframes spin{from{transform:rotate(-90deg) scale(0)}to{transform:none}}
@keyframes peek{0%{opacity:0;transform:translateY(40px)}60%{opacity:1;transform:translateY(-6px)}100%{opacity:1;transform:none}}
@keyframes tilt{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-8deg)}95%{transform:rotate(6deg)}}
@keyframes expand{from{clip-path:circle(0% at 50% 100%)}to{clip-path:circle(150% at 50% 100%)}}
@keyframes swipeL{from{transform:translateX(100%)}to{transform:none}}
@keyframes swipeR{from{transform:translateX(-100%)}to{transform:none}}
.swl{animation:swipeL .65s cubic-bezier(.22,.9,.28,1) both}.swr{animation:swipeR .65s cubic-bezier(.22,.9,.28,1) both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes wag{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(16deg)}}
@keyframes stepA{0%,100%{transform:rotate(20deg)}50%{transform:rotate(-20deg)}}
@keyframes stepB{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(20deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes walkAcross{from{transform:translateX(-170px)}to{transform:translateX(420px)}}
@keyframes hop{0%,100%{transform:none}14%{transform:translateY(5px) scale(1.07,.88)}42%{transform:translateY(-38px) scale(.95,1.07) rotate(-6deg)}58%{transform:translateY(-38px) scale(.97,1.04) rotate(-3deg)}76%{transform:translateY(3px) scale(1.09,.86)}88%{transform:translateY(-4px) scale(.98,1.02)}}
@keyframes hopB{0%,100%{transform:none}14%{transform:translateY(5px) scale(1.07,.88)}42%{transform:translateY(-38px) scale(.95,1.07) rotate(-6deg)}58%{transform:translateY(-38px) scale(.97,1.04) rotate(-3deg)}76%{transform:translateY(3px) scale(1.09,.86)}88%{transform:translateY(-4px) scale(.98,1.02)}}
@keyframes walkIn{from{transform:translateX(-170px)}to{transform:translateX(226px)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes swapA{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes swapB{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes confetti{0%{opacity:0;transform:translateY(-40px) rotate(0) scale(.4)}20%{opacity:1}100%{opacity:1;transform:translateY(0) rotate(200deg) scale(1)}}
.a-pop{animation:pop .7s cubic-bezier(.2,.9,.3,1.2) both}
.a-spin{animation:spin .8s cubic-bezier(.2,.9,.3,1) both}
.a-up{animation:fadeUp .6s ease-out both}
.a-in{animation:slideIn .55s ease-out both}
.a-rise{animation:rise .45s cubic-bezier(.2,.9,.3,1.15) backwards}
.a-peek{transform-origin:50% 100%;animation:peek .6s cubic-bezier(.2,.9,.3,1.25) .9s both,tilt 2.4s ease-in-out 1.8s 1}
.a-screen{animation:fadeIn .3s cubic-bezier(0,0,.2,1) both}
.a-right{animation:slideFromRight .3s cubic-bezier(0,0,.2,1) both}
.d1{animation-delay:.1s}.d2{animation-delay:.2s}.d3{animation-delay:.35s}.d4{animation-delay:.5s}.d5{animation-delay:.65s}.d6{animation-delay:.8s}
.expand{position:absolute;inset:0;z-index:50;animation:expand .375s cubic-bezier(.4,0,.2,1) both}
.n-tail{transform-box:fill-box;transform-origin:100% 100%;animation:wag .45s ease-in-out 8}
.n-eye{transform-box:fill-box;transform-origin:center;animation:blink 4s 3}
.walking .n-la{transform-box:fill-box;transform-origin:50% 0;animation:stepA .5s ease-in-out 6}
.walking .n-lb{transform-box:fill-box;transform-origin:50% 0;animation:stepB .5s ease-in-out 6}
.walking .n-body{animation:bob .25s ease-in-out 12}
.walker{position:absolute;animation:walkIn 2.4s cubic-bezier(.3,.1,.3,1) .4s both}
.walker .n-la,.walker .n-lb{animation-iteration-count:5.6!important}
.walker .n-body{animation-iteration-count:11.2!important}
.walker .n-tail{animation:wag .45s ease-in-out 9}
.pet{border:0;background:transparent;padding:0;cursor:pointer;display:block;transform-origin:50% 100%}
.hopper{transform-origin:50% 100%;animation:hop 1s cubic-bezier(.3,.7,.4,1) .3s 3 both}
.breather{transform-origin:50% 100%;animation:breathe 3s ease-in-out 3}
.confetti{position:absolute;animation:confetti 1.2s cubic-bezier(.2,.8,.3,1) both}
button,a{transition:transform .38s cubic-bezier(.3,1.7,.5,1)}
button:active,a:active{transform:scale(.92);transition:transform .08s cubic-bezier(.4,0,1,1)}
.quiet:active{transform:scale(.96)}
.half{transform-origin:50% 100%}
.half:active{transform:scale(.96)}
input[type=range]{-webkit-appearance:none;appearance:none;cursor:grab}
input[type=range]:active{cursor:grabbing}
input[type=range]::-webkit-slider-runnable-track{background:transparent;height:44px}
input[type=range]::-moz-range-track{background:transparent}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;margin-top:5px;border-radius:50%;border:4px solid #FFFFFF;box-shadow:0 0 0 3px #161616;transition:transform .15s}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;border:4px solid #FFFFFF;box-shadow:0 0 0 3px #161616}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.18)}
input[type=range]:focus-visible{outline:3px solid #1556C2;outline-offset:2px;border-radius:8px}
.s-time::-webkit-slider-thumb{background:#E5282E}.s-time::-moz-range-thumb{background:#E5282E}
.s-energy::-webkit-slider-thumb{background:#FFC20E}.s-energy::-moz-range-thumb{background:#FFC20E}
.scroll::-webkit-scrollbar{display:none}
@keyframes phraseIn{0%{opacity:0;transform:translateY(18px) rotate(-3deg)}60%{opacity:1;transform:translateY(-4px) rotate(1deg)}100%{opacity:1;transform:none}}
.phrase{animation:phraseIn .45s cubic-bezier(.2,.9,.3,1.2) both}
.quick .a-pop,.quick .a-spin,.quick .a-up,.quick .a-in,.quick .a-rise,.quick .a-peek{animation-duration:.25s!important;animation-delay:0s!important}
@keyframes wiggleA{0%,100%{transform:none}20%{transform:rotate(-9deg) scale(1.05,.95)}45%{transform:rotate(8deg) scale(.97,1.04)}70%{transform:rotate(-5deg)}85%{transform:rotate(3deg)}}
@keyframes wiggleB{0%,100%{transform:none}20%{transform:rotate(-9deg) scale(1.05,.95)}45%{transform:rotate(8deg) scale(.97,1.04)}70%{transform:rotate(-5deg)}85%{transform:rotate(3deg)}}
@keyframes heartUp{0%{opacity:0;transform:translateY(10px) scale(.4)}30%{opacity:1;transform:translateY(-12px) scale(1)}100%{opacity:0;transform:translateY(-48px) scale(.9)}}
.heart{animation:heartUp 1.2s ease-out both}
@keyframes zoomIn{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
.zoomIn{animation:zoomIn .3s cubic-bezier(0,0,.2,1) both}
@keyframes levelup{0%{opacity:0;transform:scale(.3) rotate(-20deg)}60%{opacity:1;transform:scale(1.12) rotate(-4deg)}100%{opacity:1;transform:rotate(-6deg)}}
.levelup{animation:levelup .5s cubic-bezier(.2,.9,.3,1.3) both}
.bubble{position:absolute;white-space:nowrap}
.calm *{animation:none!important;transition:none!important}
@keyframes flipIn{0%{transform:perspective(400px) rotateY(90deg)}60%{transform:perspective(400px) rotateY(-12deg)}100%{transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<style>
html,body{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;margin:0;height:100%;background:#FFFFFF;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#stage{touch-action:manipulation;position:absolute;top:0;left:0;width:390px;height:844px;transform-origin:0 0}
button{cursor:pointer}
</style>
</head>
<body>
<div id="stage"></div>
<template id="tpl">

<div class="{{rootClass}}" style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #161616; font-family: Inter Tight, system-ui, sans-serif; position: relative; overflow: hidden">

<!-- ============ CHECK-IN ============ -->
<sc-if value="{{isCheckin}}" hint-placeholder-val="{{ true }}">
<div class="{{checkinClass}}" style="position: absolute; inset: 0">
  <div class="a-pop" aria-hidden="true" style="position: absolute; width: 300px; height: 300px; border-radius: 50%; background: #E5282E; right: -96px; top: -112px"></div>
  <div class="a-spin d3" aria-hidden="true" style="position: absolute; width: 74px; height: 74px; border-top-right-radius: 100%; background: #FFC20E; right: 26px; top: 168px"></div>
  <div class="a-pop d4" aria-hidden="true" style="position: absolute; width: 40px; height: 40px; border-radius: 50%; border: 9px solid #0B7A3E; box-sizing: border-box; right: 112px; top: 210px"></div>

  <svg class="a-up d2" width="100" height="24" viewBox="0 0 150 36" role="img" aria-label="Noodle" style="position: absolute; right: 22px; top: 28px"><path d="M0 36 V13 a11 11 0 0 1 22 0 V36 h-7 V13 a4 4 0 0 0 -8 0 V36 z" fill="#FFFFFF"/><circle cx="39" cy="24" r="8.5" fill="none" stroke="#FFFFFF" stroke-width="7"/><circle cx="68" cy="24" r="12" fill="#FFFFFF"/><circle cx="97" cy="24" r="8.5" fill="none" stroke="#FFFFFF" stroke-width="7"/><rect x="102" y="0" width="7" height="36" rx="3.5" fill="#FFFFFF"/><rect x="114" y="0" width="7" height="36" rx="3.5" fill="#FFFFFF"/><path d="M129.5 24 H146.5 A8.5 8.5 0 1 0 144 30" fill="none" stroke="#FFFFFF" stroke-width="7"/></svg>

  <nav aria-label="Main" style="position: absolute; left: 8px; top: 10px; display: flex; gap: 2px; z-index: 5">
    <button onClick="{{navHome}}" aria-current="page" style="width: 54px; height: 54px; border: 0; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font: 800 9px Inter Tight, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #161616"><span style="height: 22px; display: flex; align-items: center; justify-content: center"><span style="width: 26px; height: 13px; border-radius: 13px 13px 0 0; background: #1556C2; margin-top: 9px"></span></span><span style="border-bottom: 2px solid #161616; padding-bottom: 1px">Move</span></button>
    <button onClick="{{navPaths}}" style="width: 54px; height: 54px; border: 0; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font: 800 9px Inter Tight, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #595959"><span style="height: 22px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect width="22" height="22" fill="#161616"/><rect x="1.5" y="1.5" width="11" height="11" fill="#E5282E"/><rect x="14" y="1.5" width="6.5" height="6" fill="#FFFFFF"/><rect x="14" y="9" width="6.5" height="3.5" fill="#FFC20E"/><rect x="1.5" y="14" width="6" height="6.5" fill="#1556C2"/><rect x="9" y="14" width="11.5" height="6.5" fill="#FFFFFF"/></svg></span><span style="border-bottom: 2px solid transparent; padding-bottom: 1px">Paths</span></button>
    <button onClick="{{navExplore}}" style="width: 54px; height: 54px; border: 0; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font: 800 9px Inter Tight, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #595959"><span style="height: 22px; display: flex; align-items: center; justify-content: center"><span style="width: 22px; height: 22px; border-radius: 50%; border: 6px solid #0B7A3E; box-sizing: border-box"></span></span><span style="border-bottom: 2px solid transparent; padding-bottom: 1px">Explore</span></button>
    <button onClick="{{navYou}}" style="width: 54px; height: 54px; border: 0; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font: 800 9px Inter Tight, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #595959"><span style="height: 22px; display: flex; align-items: center; justify-content: center"><span style="width: 22px; height: 22px; border-radius: 0 0 11px 11px; background: #F6A5A9"></span></span><span style="border-bottom: 2px solid transparent; padding-bottom: 1px">You</span></button>
  </nav>

  <h1 style="position: absolute; left: 20px; top: 84px; margin: 0; width: 300px">
   <button class="a-up d1" onClick="{{nextPhrase}}" aria-label="{{phraseAria}}" style="{{phraseStyle}}">
    <sc-if value="{{phEven}}" hint-placeholder-val="{{ true }}">
      <span class="phrase" style="display: block">
        <sc-for list="{{phraseLines}}" as="ln" hint-placeholder-count="3"><span style="display: block">{{ln.t}}</span></sc-for>
      </span>
    </sc-if>
    <sc-if value="{{phOdd}}" hint-placeholder-val="{{ true }}">
      <span class="phrase" style="display: block">
        <sc-for list="{{phraseLines}}" as="ln" hint-placeholder-count="3"><span style="display: block">{{ln.t}}</span></sc-for>
      </span>
    </sc-if>
   </button>
  </h1>

  <section class="a-in d2" aria-labelledby="p-time" style="position: absolute; left: 20px; right: 20px; top: 282px; display: flex; gap: 16px">
    <h2 id="p-time" style="margin: 0; writing-mode: vertical-rl; transform: rotate(180deg); font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: #595959">Time</h2>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
      <div style="display: flex; align-items: center; justify-content: space-between; height: 58px">
        <p style="margin: 0; display: flex; align-items: baseline; gap: 6px"><span style="font-size: 54px; font-weight: 900; line-height: 1; letter-spacing: -.03em">{{time}}</span><span style="font-size: 15px; font-weight: 700; color: #595959">min</span></p>
        <span aria-hidden="true" style="width: 58px; height: 58px; display: flex; align-items: center; justify-content: center"><span style="{{timeDot}}"></span></span>
      </div>
      <div style="position: relative; height: 44px">
        <span aria-hidden="true" style="{{timeTrack}}"></span>
        <input class="s-time" type="range" min="5" max="60" step="5" value="{{time}}" onChange="{{onTime}}" aria-label="Session length in minutes" style="position: absolute; left: 0; top: 0; width: 100%; height: 44px; margin: 0; background: transparent">
      </div>
    </div>
  </section>

  <section class="a-in d3" aria-labelledby="p-energy" style="position: absolute; left: 20px; right: 20px; top: 398px; display: flex; gap: 16px">
    <h2 id="p-energy" style="margin: 0; writing-mode: vertical-rl; transform: rotate(180deg); font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: #595959">Energy</h2>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
      <div style="display: flex; align-items: center; justify-content: space-between; height: 58px">
        <p style="margin: 0; font-size: 40px; font-weight: 900; line-height: 1; letter-spacing: -.03em">{{energyLabel}}</p>
        <span aria-hidden="true" style="width: 58px; height: 58px; display: flex; align-items: flex-end; justify-content: center"><span style="{{energyTri}}"></span></span>
      </div>
      <div style="position: relative; height: 44px">
        <span aria-hidden="true" style="{{energyTrack}}"></span>
        <input class="s-energy" type="range" min="0" max="100" step="1" value="{{energy}}" onChange="{{onEnergy}}" aria-label="Energy level" aria-valuetext="{{energyLabel}}" style="position: absolute; left: 0; top: 0; width: 100%; height: 44px; margin: 0; background: transparent">
      </div>
    </div>
  </section>

  <section class="a-in d4" aria-labelledby="p-mood" style="position: absolute; left: 20px; right: 12px; top: 520px; display: flex; align-items: flex-end; gap: 10px">
    <h2 id="p-mood" style="margin: 0; writing-mode: vertical-rl; transform: rotate(180deg); font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: #595959">Mood</h2>
    <div style="display: flex; align-items: flex-end; gap: 2px">
      <sc-for list="{{moods}}" as="m" hint-placeholder-count="5">
        <button onClick="{{m.pick}}" aria-pressed="{{m.on}}" style="border: 0; background: transparent; padding: 0; width: 54px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-family: Inter Tight, sans-serif; color: #161616">
          <span style="height: 46px; display: flex; align-items: flex-end; justify-content: center"><span style="{{m.shape}}"></span></span>
          <span style="{{m.lab}}">{{m.l}}</span>
          <span style="{{m.bar}}"></span>
        </button>
      </sc-for>
    </div>
  </section>

  <button class="a-rise d5 half" onClick="{{go}}" style="position: absolute; left: 45px; bottom: -1px; width: 300px; height: 150px; border: 0; border-radius: 150px 150px 0 0; background: #1556C2; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 0 0 34px; box-sizing: border-box; font-family: Inter Tight, sans-serif">
    <span style="font-size: 56px; font-weight: 900; line-height: .9; letter-spacing: -.03em">GO</span>
    <span style="font-size: 13px; font-weight: 600; margin-top: 4px; color: #DDE7FA">build my session</span>
  </button>
  <button class="pet" onClick="{{petHome}}" aria-label="Pet Noodle" style="position: absolute; left: 147px; top: 640px; width: 96px; height: 62px">
   <span style="{{petWiggle}}">
   <svg class="a-peek" width="96" height="62" viewBox="0 0 100 64" aria-hidden="true" style="display: block; overflow: visible">
    <ellipse cx="27" cy="34" rx="8" ry="16" fill="#161616" style="{{earL}}"/>
    <ellipse cx="73" cy="34" rx="8" ry="16" fill="#161616" style="{{earR}}"/>
    <circle cx="50" cy="30" r="24" fill="#E5282E"/>
    <circle cx="33" cy="36" r="4" fill="#F6A5A9" style="{{blush}}"/><circle cx="67" cy="36" r="4" fill="#F6A5A9" style="{{blush}}"/>
    <ellipse cx="50" cy="42" rx="12" ry="9" fill="#FFC20E"/>
    <circle cx="50" cy="37" r="4.5" fill="#161616"/>
    <g style="{{openEyes}}"><circle class="n-eye" cx="41" cy="25" r="3.5" fill="#161616"/><circle class="n-eye" cx="59" cy="25" r="3.5" fill="#161616"/></g>
    <g style="{{happyEyes}}"><path d="M37 27 q4 -6 8 0" stroke="#161616" stroke-width="2.8" fill="none" stroke-linecap="round"/><path d="M55 27 q4 -6 8 0" stroke="#161616" stroke-width="2.8" fill="none" stroke-linecap="round"/></g>
    <path d="M18 64 v-6 a8 8 0 0 1 16 0 v6 z" fill="#161616"/>
    <path d="M66 64 v-6 a8 8 0 0 1 16 0 v6 z" fill="#161616"/>
   </svg>
   </span>
   <sc-if value="{{petting}}" hint-placeholder-val="{{ false }}"><span style="{{heartsBox}}"><svg width="18" height="16" viewBox="0 0 18 16" aria-hidden="true" style="position: absolute; left: 10px; top: -6px; animation-delay: 0s" class="heart"><circle cx="5" cy="5" r="5" fill="#F6A5A9"/><circle cx="13" cy="5" r="5" fill="#F6A5A9"/><path d="M0.6 7 L9 16 L17.4 7 Z" fill="#F6A5A9"/></svg><svg width="18" height="16" viewBox="0 0 18 16" aria-hidden="true" style="position: absolute; left: 40px; top: -6px; animation-delay: 0.15s" class="heart"><circle cx="5" cy="5" r="5" fill="#F6A5A9"/><circle cx="13" cy="5" r="5" fill="#F6A5A9"/><path d="M0.6 7 L9 16 L17.4 7 Z" fill="#F6A5A9"/></svg><svg width="18" height="16" viewBox="0 0 18 16" aria-hidden="true" style="position: absolute; left: 70px; top: -6px; animation-delay: 0.3s" class="heart"><circle cx="5" cy="5" r="5" fill="#F6A5A9"/><circle cx="13" cy="5" r="5" fill="#F6A5A9"/><path d="M0.6 7 L9 16 L17.4 7 Z" fill="#F6A5A9"/></svg></span></sc-if>
  </button>
  <div class="a-pop d6" aria-hidden="true" style="position: absolute; left: 0; bottom: 0; width: 46px; height: 46px; background: #F26A0F; clip-path: polygon(0 0, 100% 100%, 0 100%)"></div>
  <div class="a-pop d6" aria-hidden="true" style="position: absolute; right: 0; bottom: 0; width: 46px; height: 46px; background: #F6A5A9; border-top-left-radius: 100%"></div>
</div>
</sc-if>

<!-- ============ SESSION ============ -->
<sc-if value="{{isSession}}" hint-placeholder-val="{{ false }}">
<div class="a-screen" style="position: absolute; inset: 0; display: flex; flex-direction: column">
  <header style="position: relative; height: 262px; flex: none; background: #1556C2; color: #FFFFFF; overflow: hidden">
    <div class="a-spin d2" aria-hidden="true" style="position: absolute; width: 130px; height: 130px; border-top-left-radius: 100%; background: #FFC20E; right: 0; bottom: 0"></div>
    <div class="a-pop d3" aria-hidden="true" style="position: absolute; width: 64px; height: 32px; border-radius: 32px 32px 0 0; background: #F6A5A9; right: 120px; top: 64px"></div>
    <div class="a-pop d4" aria-hidden="true" style="position: absolute; width: 22px; height: 22px; border-radius: 50%; background: #E5282E; right: 40px; top: 70px"></div>
    <div style="position: absolute; left: 12px; right: 12px; top: 12px; display: flex; justify-content: space-between">

<script src="app.js"></script>
<script>
(function(){
var d=document,opt={passive:false};
['gesturestart','gesturechange','gestureend'].forEach(function(t){d.addEventListener(t,function(e){e.preventDefault();},opt);});
d.addEventListener('dblclick',function(e){e.preventDefault();},opt);
var last=0;
d.addEventListener('touchend',function(e){var n=Date.now();if(n-last<350)e.preventDefault();last=n;},opt);
d.addEventListener('touchmove',function(e){if(e.touches.length>1||(e.scale&&e.scale!==1))e.preventDefault();},opt);
d.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault();},opt);
// swipe between tabs
var tabs=['checkin','paths','explore','you'],sx=0,sy=0,st=0;
d.addEventListener('touchstart',function(e){if(e.touches.length!==1)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now();},{passive:true});
d.addEventListener('touchend',function(e){
  var c=window.__noodle;if(!c||!e.changedTouches.length)return;
  if(e.target.closest&&e.target.closest('input[type=range]'))return;
  var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.5||Date.now()-st>700)return;
  var i=tabs.indexOf(c.state.screen);if(i<0)return;
  var j=dx<0?i+1:i-1;if(j<0||j>=tabs.length)return;
  c.swipeTo(tabs[j],tabs[j]==='paths'?{pathOpen:null}:{});
},{passive:true});
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
